# Example: scan agent instruction files and prompts on every pull request.
# Copy into your repo's .github/workflows/. On PRs only changed files are scanned;
# on push the whole directory is. Findings show up as annotations and, with the
# upload step, in the Security tab.
name: promptscan
on:
  pull_request:
  push:
    branches: [main, master]
permissions:
  contents: read
  security-events: write
jobs:
  promptscan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: 0xdewy/promptscan@master
        id: scan
        with:
          path: .
      - uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: ${{ steps.scan.outputs.sarif }}
