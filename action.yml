name: promptscan
description: Scan prompt and instruction files (CLAUDE.md, AGENTS.md, .cursorrules, prompts/) for prompt injection and hidden Unicode text.
branding:
  icon: shield
  color: purple
inputs:
  path:
    description: File or directory to scan.
    required: false
    default: .
  changed-only:
    description: On pull requests, scan only text files changed by the PR.
    required: false
    default: "true"
  fail:
    description: Fail the job when something is found. Set "false" to only annotate.
    required: false
    default: "true"
  threshold:
    description: Override the model's decision threshold (0-1). Higher means fewer flags.
    required: false
    default: ""
  sarif:
    description: Path of the SARIF report to write (upload it with github/codeql-action/upload-sarif).
    required: false
    default: promptscan.sarif
  version:
    description: promptscan version to install, e.g. "0.2.0". Empty installs the latest.
    required: false
    default: ""
outputs:
  sarif:
    description: Path of the SARIF report.
    value: ${{ inputs.sarif }}
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v7
      with:
        python-version: "3.12"
    - uses: actions/cache@v6
      with:
        path: ~/.cache/huggingface
        key: promptscan-model-${{ inputs.version || 'latest' }}
    - shell: bash
      # CPU-only torch first: the default wheel pulls ~5 GB of CUDA libraries the runner never uses.
      run: |
        pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
        pip install --quiet "promptscan${{ inputs.version && format('=={0}', inputs.version) || '' }}"
    - shell: bash
      env:
        BASE_REF: ${{ github.base_ref }}
        PATH_INPUT: ${{ inputs.path }}
        CHANGED_ONLY: ${{ inputs.changed-only }}
        FAIL: ${{ inputs.fail }}
        THRESHOLD: ${{ inputs.threshold }}
        SARIF: ${{ inputs.sarif }}
      run: |
        args=(--sarif "$SARIF")
        [ -n "$THRESHOLD" ] && args+=(--threshold "$THRESHOLD")
        [ "$FAIL" = "true" ] || args+=(--no-fail)
        if [ "$CHANGED_ONLY" = "true" ] && [ -n "$BASE_REF" ]; then
          # The checkout is the PR merged into the current base tip, so diffing against
          # that tip yields exactly the PR's changes, even when the base moved after the
          # PR was opened. (pull_request.base.sha is frozen at PR creation.)
          git fetch --quiet --depth=1 origin "$BASE_REF"
          promptscan --changed FETCH_HEAD "${args[@]}"
        else
          promptscan "$PATH_INPUT" "${args[@]}"
        fi
