[project]
name = "promptscan"
version = "0.3.0"
description = "Prompt injection detection for the files your AI agents read and the text your app feeds them"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    {name = "0xdewy"},
]


classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
keywords = ["security", "ai-safety", "prompt-injection", "machine-learning", "nlp", "content-moderation"]

dependencies = [
    "torch>=2.0.0",
    "safetensors>=0.4.0",
    "huggingface-hub>=0.20.0",
    "requests>=2.31.0",
    "numpy>=1.24.0",
    "transformers>=4.56.0",
    "tokenizers>=0.13.0",
    "sentencepiece>=0.2.2",
    "protobuf>=7.36.2",
]



[project.urls]
Homepage = "https://github.com/0xdewy/promptscan"
"Hosted API" = "https://promptscan.dewy.ch"
Models = "https://huggingface.co/0xdewy/promptscan"

[project.scripts]
promptscan = "promptscan.cli:main"
promptscan-mcp = "promptscan.mcp_server:main"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["promptscan", "promptscan.utils"]
include-package-data = true


[project.optional-dependencies]
train = [
    "pandas>=2.0.0",
    "pyarrow>=17.0.0",
    "psutil>=5.9.0",
    "datasets>=4.8.4",
    "scikit-learn>=1.7.2",
    "scipy>=1.10.0",
    "accelerate>=1.0.0",
]
dev = [
    "pytest>=7.4.0",
    "ruff>=0.1.0",
    "mypy>=1.4.0",
    "build>=1.0.0",
    "twine>=4.0.0",
]
docs = [
    "sphinx>=7.0.0",
    "sphinx-rtd-theme>=1.3.0",
]
markdown = [
    "markdown>=3.5.0",
]
mcp = [
    "mcp>=1.2.0",
]
rl = [
    "promptscan[train]",
    "peft>=0.21.2",
    "trl>=1.14.2",
]

[tool.uv]
# UV-specific configuration
link-mode = "copy"



[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
